# Copy to wrangler.toml, or let `npm run setup` generate and fill it for you.
#
# Secrets are not stored here. `npm run setup` generates the first one into
# ../../.secrets/cloud-mail.env and uploads it with `wrangler secret put`:
#   OPERATOR_KEY      operator console + cloud-mail CLI (/admin/api/*)
#   CF_API_TOKEN      optional; lets the admin UI list zones / add domains
# Agents (/mcp, /api/v1) use per-tenant tokens kept in D1: cloud-mail tenants create.

name = "cloud-mail-share"
account_id = "REPLACE_WITH_ACCOUNT_ID"
main = "src/index.ts"
compatibility_date = "2026-05-25"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

routes = [
  { pattern = "inbox.example.com", custom_domain = true }
]

kv_namespaces = [
  { binding = "SHARE_LINKS", id = "REPLACE_WITH_KV_NAMESPACE_ID" }
]

# Tenants and the addresses they own. Strongly consistent: names are claimed first come, first served.
d1_databases = [
  { binding = "DB", database_name = "cloud-mail-share", database_id = "REPLACE_WITH_D1_DATABASE_ID", migrations_dir = "migrations" }
]

# Mail is read through intake's internal entrypoint: no token, no public hop.
services = [
  { binding = "INTAKE", service = "cloud-mail-intake", entrypoint = "InternalApi" }
]

[assets]
directory = "./dist"
binding = "ASSETS"
# Every request the Worker sees is one of the free plan's 100,000 a day, including
# a plain /assets/app.js. Only the paths below need code; the bundler's output is
# served straight from the asset layer, so one page load costs one request instead
# of a dozen. Add a path here when you add a Worker route.
run_worker_first = [
  "/",
  "/all-mail",
  "/admin",
  "/admin/*",
  "/api/v1/*",
  "/mcp",
  "/mcp/*",
  "/s/*",
  "/icons/*",
  "/sw.js",
  "/manifest.webmanifest",
]
not_found_handling = "none"
html_handling = "none"

[observability]
enabled = true
head_sampling_rate = 1
